services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    volumes:
      - billitup_data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  billitup_data:
