server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API lives in a separate container ("server" on the docker-compose
  # network). Proxying it under the same origin means the browser never needs
  # to know a different host/port — the client's own fetch calls to "/api/..."
  # (see client/src/lib/api.js) just work, whether you're on localhost or on
  # the real domain through the Cloudflare Tunnel.
  location /api/ {
    proxy_pass http://server:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page app: any path that isn't a real static file falls back to
  # index.html so client-side routing (React Router) handles it.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
